---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: License Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-check:
    name: Check Dependency Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # mise.toml pins go-licenses; `go install ...@latest` here meant CI could
      # silently pick up a new version mid-PR and disagree with local runs.
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      # Both recipes so the allow-list is defined once, in the justfile's
      # `allowed_licenses`. It was previously spelled out again inline here,
      # free to drift.
      - name: Check licenses
        run: just license-check

      - name: Generate license report
        if: always()
        run: just license-report > licenses.csv

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: licenses.csv
