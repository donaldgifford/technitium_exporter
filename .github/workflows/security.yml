---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Determine known CVEs through `govulncheck`
on:
  push:
    branches:
      - main
  schedule:
    # Mondays at 0000
    - cron: "0 0 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-for-vulnerabilities:
    name: Check for vulnerabilities using `govulncheck`
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      # No checkout step: govulncheck-action is a composite action whose first
      # step is its own actions/checkout (its repo-checkout input defaults to
      # true). ci.yml passes repo-checkout: false only because that job checks
      # out separately for its trivy step.
      - uses: donaldgifford/govulncheck-action@v1
        with:
          # SARIF rather than text so the result can be consumed by the
          # repository's Code Scanning tab.
          output-format: sarif
          output-file: govulncheck.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4.35.5
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
