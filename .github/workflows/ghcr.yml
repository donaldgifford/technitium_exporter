---
# $schema=https://www.schemastore.org/github-action.json
name: Publish to GHCR

# Called from release.yml after bump-version. Also dispatchable for ad-hoc
# republishes:
#   image — push container image when `tag` is supplied
on:
  workflow_call:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v1.8.2). Empty = skip image push.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Package but do not push.'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v1.8.2). Leave empty to skip image push.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Package but do not push.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: donaldgifford/technitium_exporter

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # No cancellation: this workflow pushes container images to the registry;
  # cancelling mid-run leaves a partial manifest list.
  cancel-in-progress: false

jobs:
  image:
    name: Publish image
    runs-on: ubuntu-latest
    if: inputs.tag != ''
    outputs:
      # digest/published are written by the Capture-image-digest step
      # (id: digest), NOT the bake step — bake only outputs metadata.
      # Referencing the wrong step id left these empty and silently
      # skipped image-slsa on every publish (ecr.yml had it right).
      digest: ${{ steps.digest.outputs.digest }}
      published: ${{ steps.digest.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest

      - name: Build and push image
        id: bake
        if: inputs.dry_run != true
        uses: docker/bake-action@v7
        with:
          targets: release
          source: .
          files: |
            docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-tags }}
            ${{ steps.meta.outputs.bake-file-labels }}
          set: |-
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Capture image digest
        id: digest
        if: steps.bake.conclusion == 'success' && inputs.dry_run != true
        # Metadata is passed via env, NOT interpolated into the script:
        # the bake metadata JSON can contain quotes/parens that break
        # shell syntax when inlined (broke the v1.8.2 release run).
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          digest=$(jq -r '.release."containerimage.digest"' <<< "${BAKE_METADATA}")
          if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
            echo "ERROR: failed to capture image digest from bake metadata"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Sign image with cosign
        if: steps.digest.outputs.published == 'true'
        run: |
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_REPO}@${{ steps.digest.outputs.digest }}"

      - name: Write image summary
        if: always()
        run: |
          {
            echo "## GHCR Image Publish"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Image | \`${REGISTRY}/${IMAGE_REPO}\` |"
            echo "| Tag | \`${{ inputs.tag }}\` |"
            echo "| Pushed | \`${{ steps.digest.outputs.published || 'false' }}\` |"
            if [ -n "${{ steps.digest.outputs.digest }}" ]; then
              echo "| Digest | \`${{ steps.digest.outputs.digest }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  image-slsa:
    name: SLSA provenance (image)
    needs: image
    if: needs.image.outputs.published == 'true'
    permissions:
      id-token: write
      packages: write
      contents: read
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/donaldgifford/technitium_exporter
      digest: ${{ needs.image.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
