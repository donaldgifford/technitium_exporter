---
# yaml-language-server: $schema=https://www.schemastore.org/yamllint.json
# yamllint configuration for project

extends: default

rules:
  # Line length - GitHub Actions can have long lines
  line-length:
    max: 120
    level: warning

  # Indentation - 2 spaces
  indentation:
    spaces: 2
    indent-sequences: true

  # Comments - require space after #
  comments:
    min-spaces-from-content: 1

  # Trailing spaces
  # trailing-spaces: enable

  # Document start (---) - not required for all files
  document-start:
    present: true

  # Truthy values - allow yes/no/on/off
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on", "off"]
    check-keys: false

  # Empty values
  #
  # forbid-in-block-mappings is off because bare GitHub Actions triggers
  # (`pull_request:`, `workflow_dispatch:`) are valueless block-mapping keys and
  # are the idiomatic way to write them. yamllint has no per-path rule
  # overrides, so the alternative was a `# yamllint disable-line` comment on
  # every trigger in every workflow, forever. The configs that would benefit
  # most from the rule are schema-checked anyway -- `just lint-config` for
  # golangci-lint and `just release-check` for goreleaser.
  empty-values:
    forbid-in-block-mappings: false
    forbid-in-flow-mappings: true

  # Brackets
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0

  # Braces
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

# .github/ is deliberately NOT ignored. The workflows are the highest-churn
# YAML in the repo and were the only files never being linted; actionlint
# checks their semantics but not their formatting.
#
# Dropped from this list when .github/ was unignored: `vendor/`, `.charts/`,
# and a `key-duplicates` exemption for config/testdata/section_key_dup.bad.yml
# -- none of those paths exist in this repo.
ignore: |-
  node_modules/
  .git/
  build/
  dist/
  # Generated by `docz wiki update`, which rewrites it with 4-space indent and
  # no document start. Formatting it here just means the next docz run reverts
  # the change -- same reasoning as CHANGELOG.md in .prettierignore.
  mkdocs.yml
