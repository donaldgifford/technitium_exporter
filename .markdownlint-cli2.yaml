---
# yaml-language-server: $schema=https://raw.githubusercontent.com/DavidAnson/markdownlint-cli2/main/schema/markdownlint-cli2-config-schema.json
# Runner options for markdownlint-cli2. The lint RULES live in
# .markdownlint.yaml -- cli2 reads that automatically. This file only carries
# options cli2 itself understands, of which `ignores` is the one we need.
#
# Note: .markdownlintignore is a markdownlint-cli (v1) feature and is silently
# ignored by cli2, which is why the excludes have to live here.
ignores:
  # Generated by git-cliff. Its per-release "### Bug Fixes" / "### Features"
  # headings repeat by design, which MD024 flags. It is also byte-for-byte
  # verified by the changelog drift check, so reformatting it breaks CI.
  # Excluded from prettier for the same reason -- see .prettierignore.
  - CHANGELOG.md
  # Machine-owned session state, gitignored.
  - .claude/**
  # Build and dependency output.
  - node_modules/**
  - dist/**
  - build/**
